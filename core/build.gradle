plugins {
    id "net.kyori.blossom"
    id "io.freefair.lombok"
}

def targetJavaVersion = 8
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

def isStandalone = project.hasProperty('standalone')

blossom {
    replaceToken("@VERSION@", project.version)
    replaceToken("@STANDALONE@", isStandalone)
}

dependencies {
    compileOnly "org.spigotmc:spigot-api:1.16.5-R0.1-SNAPSHOT"
    compileOnly "net.kyori:adventure-api:4.17.0"
    compileOnly "net.kyori:adventure-text-serializer-legacy:4.17.0"
    compileOnly "net.kyori:adventure-text-minimessage:4.17.0"
    compileOnly "org.jetbrains:annotations:24.0.0"
    compileOnly "org.incendo:cloud-paper:2.0.1"
    compileOnly "org.incendo:cloud-annotations:2.1.0"
    compileOnly "eu.xap3y:xagui:${xaGuiVer}"
}
