plugins {
    id "io.github.goooler.shadow" version "8.1.7"
    id 'io.freefair.lombok' version '8.7.1' apply false
    id 'net.kyori.blossom' version "1.3.1" apply false
    id 'java'
}

allprojects {
    group = 'eu.xap3y'
    version = '1.4.0'

    repositories {
        //mavenLocal()
        mavenCentral()
        maven { url = "https://repo.papermc.io/repository/maven-public/" }
        maven { url = "https://oss.sonatype.org/content/groups/public/" }
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.freefair.lombok'
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

def isStandalone = project.hasProperty('standalone')

configurations {
    implConditional
}

dependencies {
    implementation project(':core')
    implementation project(':paper')

    def xaguiDep = "eu.xap3y:xagui:${xaGuiVer}"
    def cloudPaperDep = 'org.incendo:cloud-paper:2.0.0'
    def cloudAnnotationsDep = 'org.incendo:cloud-annotations:2.1.0'

    implConditional xaguiDep
    implConditional "eu.xap3y:xagui-paper:${xaGuiVer}"
    implConditional cloudPaperDep
    implConditional cloudAnnotationsDep
}

if (isStandalone) {
    configurations.implementation.extendsFrom(configurations.implConditional)
} else {
    configurations.compileOnly.extendsFrom(configurations.implConditional)
}

tasks {
    jar {
        enabled = false
    }

    shadowJar {
        archiveClassifier = isStandalone ? 'standalone' : 'dependent'
        archiveBaseName = 'Mentions'

        if (isStandalone) {
            relocate 'org.incendo.cloud', 'eu.xap3y.mentions.libs.cloud'
            relocate 'eu.xap3y.xagui', 'eu.xap3y.mentions.libs.xagui'
        }
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Builds both standalone and dependent jars'

    doLast {
        exec { commandLine './gradlew', 'clean', 'shadowJar' }
        exec { commandLine './gradlew', 'shadowJar', '-Pstandalone' }
        println "Successfully built both jars in build/libs/"
    }
}

processResources {
    def dependLine = !isStandalone ? "\ndepend:\n  - XaLib" : ""
    def props = [
            version: project.version,
            website: "https://plugins.xap3y.eu/mentions",
            description: "Mention plugin",
            dependClause: dependLine
    ]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
