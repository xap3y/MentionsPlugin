plugins {
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'io.freefair.lombok' version '8.7.1'
    id 'net.kyori.blossom' version "1.3.1"
    id 'java'
}

group = 'eu.xap3y'
version = '1.3.2'
def baseCoordinates = "Mentions"

def pluginDesc = "Mention plugin for Minecore."
def pluginSite = "https://minecore.cz"

def isStandalone = project.hasProperty('standalone')

blossom {
    replaceToken("@VERSION@", version)
    replaceToken("@STANDALONE@", isStandalone)
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }

    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
}

def xaguiDep = 'eu.xap3y:xagui:1.5.0'
def cloudPaperDep = 'org.incendo:cloud-paper:2.0.0-beta.17'
def cloudAnnotationsDep = 'org.incendo:cloud-annotations:2.0.0'

configurations {
    implConditional
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:1.20.4-R0.1-SNAPSHOT"

    implementation 'org.bstats:bstats-bukkit:3.2.1'

    implConditional xaguiDep
    implConditional cloudPaperDep
    implConditional cloudAnnotationsDep
}

if (isStandalone) {
    configurations.implementation.extendsFrom(configurations.implConditional)
} else {
    configurations.compileOnly.extendsFrom(configurations.implConditional)
}

def targetJavaVersion = 17
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def dependLine = !isStandalone ? "\ndepend:\n  - XaLib" : ""
    def props = [
            version: version,
            website: pluginSite,
            description: pluginDesc,
            dependClause: dependLine
    ]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

build {
    dependsOn(shadowJar)
}

tasks {
    jar {
        // Disable the standard jar completely, because it cannot shade bStats.
        enabled = false
    }

    shadowJar {
        archiveClassifier = isStandalone ? 'standalone' : 'dependent'
        archiveBaseName = baseCoordinates

        relocate 'org.bstats', 'eu.xap3y.mentions.libs.bstats'

        if (isStandalone) {
            relocate 'org.incendo.cloud', 'eu.xap3y.mentions.libs.cloud'
            relocate 'eu.xap3y.xagui', 'eu.xap3y.mentions.libs.xagui'
        }
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Builds both standalone and dependent jars'

    doLast {
        exec {
            commandLine './gradlew', 'clean', 'shadowJar'
        }
        exec {
            commandLine './gradlew', 'shadowJar', '-Pstandalone'
        }
        println "Successfully built both jars in build/libs/"
    }
}